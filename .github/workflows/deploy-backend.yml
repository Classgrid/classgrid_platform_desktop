name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'



      - name: SSH and Deploy Backend
        uses: appleboy/ssh-action@master
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: PRODUCTION_ENV
          script: |
            cd /var/www/classgrid_platform
            
            # Pull the latest code from GitHub
            git fetch origin main
            git reset --hard origin/main
            
            # Go into server folder, install new packages, and restart PM2
            cd server
            echo "$PRODUCTION_ENV" > .env
            npm install --omit=dev
            
            # FREE UP RAM & ADD SWAP SPACE TO PREVENT OUT-OF-MEMORY CRASHES
            sudo fallocate -l 2G /swapfile || true
            sudo chmod 600 /swapfile || true
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
            sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true

            # INSTALL AND FORCE RESTART REDIS TO FIX THE OUTAGE
            sudo apt-get update || true
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y redis-server || true
            # FIX IPV6 BIND ERROR ON EC2 WHICH CAUSES REDIS TO CRASH ON STARTUP
            sudo sed -i 's/bind 127.0.0.1 ::1/bind 127.0.0.1/' /etc/redis/redis.conf || true
            sudo systemctl enable redis-server || true
            sudo systemctl restart redis-server || sudo service redis restart || true
            pm2 restart all --update-env


